<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Institutions Map</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>Academic Map</h1>
                <p>Explore 110k+ institutions</p>
                <button id="toggle-sidebar-mobile">☰</button>
            </div>
            
            <div class="sidebar-content">
                <!-- Search -->
                <div class="filter-group search-container">
                    <input type="text" id="search-input" placeholder="Search institutions..." autocomplete="off">
                    <div id="search-results" class="hidden"></div>
                </div>

                <!-- Filters -->
                <div class="filter-group">
                    <h3>Institution Type</h3>
                    <div id="type-filters" class="checkbox-group">
                        <!-- Checkboxes injected by JS -->
                    </div>
                </div>

                <div class="filter-group">
                    <h3>Ownership</h3>
                    <div id="ownership-filters" class="checkbox-group">
                        <!-- Checkboxes injected by JS -->
                    </div>
                </div>

                <div class="filter-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <h3 style="margin-bottom: 0;">Discipline</h3>
                        <button id="clear-discipline-filter" style="font-size: 0.75rem; cursor: pointer; background: none; border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; display: none;">Clear</button>
                    </div>
                    <select id="discipline-filter" style="width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.875rem;">
                        <option value="">All Disciplines</option>
                        <!-- Options injected by JS -->
                    </select>
                </div>

                <div class="filter-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <h3 style="margin-bottom: 0;">Filter by Country</h3>
                        <button id="clear-country-filter" style="font-size: 0.75rem; cursor: pointer; background: none; border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px;">Clear All</button>
                    </div>
                    <input type="text" id="country-search" placeholder="Search country code..." style="width: 100%; padding: 6px; margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.875rem;">
                    <div id="country-filters" class="checkbox-group" style="max-height: 150px; overflow-y: auto; border: 1px solid var(--border-color); padding: 8px; border-radius: 4px;">
                        <!-- Checkboxes injected by JS -->
                    </div>
                </div>

                <div class="filter-group">
                    <h3>Min Works Count</h3>
                    <div class="slider-container">
                        <input type="range" id="works-slider" min="0" max="100000" value="0" step="100">
                        <span id="works-slider-val">0</span>
                    </div>
                </div>

                <!-- Top Institutions Tab -->
                <div class="filter-group" style="border-top: 1px solid var(--border-color); padding-top: 16px;">
                    <h3 id="toggle-top-institutions" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
                        Top Institutions 
                        <span id="top-inst-icon">▼</span>
                    </h3>
                    <div id="top-institutions-content" style="display: none; margin-top: 12px;">
                        <div id="top-inst-subtitle" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;"></div>
                        <div class="table-container">
                            <table id="top-institutions-table">
                                <thead>
                                    <tr>
                                        <th data-sort="n">Name</th>
                                        <th data-sort="w" class="active-sort desc">Works</th>
                                        <th data-sort="cb">Citations</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main id="map-wrapper">
            <div id="map"></div>

        </main>

        <!-- Detail Panel (Right Sidebar) -->
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="close-detail">×</button>
            </div>
            <div id="detail-content">
                <div class="detail-loader">Loading...</div>
                <!-- Content injected by JS -->
            </div>
        </aside>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/nextapps-de/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Custom Scripts -->
    <script src="js/filters.js"></script>
    <script src="js/detail.js"></script>
    <script src="js/search.js"></script>
    <script src="js/map.js"></script>

</body>
</html>
